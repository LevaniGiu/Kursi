<style>
:root{--bg:#EEF2F7;--card:#fff;--ink:#14203A;--mute:#6B7A90;--line:#E0E6EF;--navy:#14203A;--ok:#1E8E5A;--bad:#C0392B;--ac:var(--navy);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#18243A;--ink:#E8EEF5;--mute:#93A5B8;--line:#2A3A52;--navy:#3D5FA8;--ok:#4CC38A;--bad:#FF7B6B}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#18243A;--ink:#E8EEF5;--mute:#93A5B8;--line:#2A3A52;--navy:#3D5FA8;--ok:#4CC38A;--bad:#FF7B6B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Georgian',system-ui,sans-serif;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;font-weight:800;margin:4px 0 0}
h2{font-size:1.3rem;font-weight:800;margin:8px 0 14px}
.sub,.hint{color:var(--mute);font-size:.9rem;margin:2px 0 12px}
.hint{margin:16px 0 0}
.pr{display:flex;gap:10px;margin:12px 0}
.pr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pill{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:12px 8px;border-radius:14px;cursor:pointer}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill:disabled{opacity:.55;cursor:default}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.88rem}
.sec{color:var(--mute);font-weight:600;font-size:.85rem;margin:22px 0 4px}
.gd,.row,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;box-shadow:0 1px 3px rgba(20,32,58,.06)}
.gd summary,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;font-weight:600;cursor:pointer;list-style:none}
.gd summary::-webkit-details-marker{display:none}
.row{width:100%;text-align:left;color:var(--ink);font:inherit;font-weight:600}
.gd .g{margin:0 12px 12px}
.lv{color:var(--mute);font-size:.8rem;font-weight:600;white-space:nowrap}
.card{padding:2px 16px}
.back{border:0;background:none;color:var(--mute);font:inherit;padding:6px 0;cursor:pointer}
.w{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.w:last-child{border-bottom:0}
.w .f{font-weight:800;font-size:1.05rem}
.w .t{flex:1}
.w .p{color:var(--mute);font-size:.88rem}
.say{border:0;background:var(--navy);color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;flex:none}
.g{background:var(--bg);border-left:4px solid var(--navy);padding:12px 16px;margin:14px 0;border-radius:4px 12px 12px 4px}
.g li{margin:4px 0}
.cta{display:block;width:100%;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:800;padding:14px;margin:18px 0;border-radius:14px;cursor:pointer}
.q{font-size:2rem;font-weight:800;text-align:center;margin:24px 0 4px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:14px;margin:8px 0;border-radius:14px;cursor:pointer}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.tb{overflow-x:auto;margin:8px 0 14px}table{border-collapse:collapse;font-size:.85rem}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}th{background:var(--card)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;padding:0 12px 6px;box-shadow:0 1px 3px rgba(20,32,58,.06)}.grp>summary{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;font-weight:800;cursor:pointer;list-style:none}.grp>summary::-webkit-details-marker{display:none}.grp .gd{box-shadow:none;background:var(--bg)}.grp .g{background:var(--card)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
</style>
</head>

'არსებითი სახელი და გვარი':`<hr><b>დამატებითი წესები:</b><ul><li><b>der:</b> -ling, -ismus, -ist, -ant (der Frühling, der Tourist); ამინდი: der Regen, der Wind, der Schnee; ალკოჰოლი: der Wein, der Wodka.</li><li><b>die:</b> -ei, -ie, -ik, -ur, -tät, -ion, -ung, -heit, -keit, -schaft, -in (die Bäckerei, die Musik, die Universität, die Lehrerin).</li><li><b>das:</b> -chen, -lein, -um, -ment; ზმნიდან სახელი: das Lernen; ლითონები: das Gold.</li></ul>სიტყვა ყოველთვის არტიკლთან ერთად ისწავლე: der Tisch, die Lampe, das Bett.`,

'პირადი ნაცვალსახელები':`<hr>Ich liebe dich. – მიყვარხარ.<br>Er hilft mir. – მეხმარება.<br>Sie gibt ihm das Buch. – მას წიგნს აძლევს.<br>Ich gebe es ihm. – მას ვაძლევ. (ნაცვალსახელი Akk წინ დგას)<br>er / sie / es ეთანხმება არსებითის გვარს: Der Tisch? Er ist neu. Die Lampe? Sie ist hell. Das Buch? Ich lese es.<br>Sie (დიდი ასოთი) – თქვენ, ზრდილობიანი; sie (პატარა) – ის (მდედრ.) ან ისინი.`,
'მიკუთვნებითი ნაცვალსახელები':`<hr>Das ist mein Bruder und das ist meine Schwester.<br>Hast du deinen Schlüssel? – გასაღები გაქვს?<br>Wir besuchen unsere Eltern. – მშობლებს ვსტუმრობთ.<br>Ist das Ihr Auto? – ეს თქვენი მანქანაა? (ზრდილობიანი)<br>sein = მისი (მამრ. და საშ. მფლობელი): Peter und sein Hund. | ihr = მისი (მდედრ. მფლობელი): Anna und ihr Hund.`,
'რეფლექსიური ნაცვალსახელები':`<hr><b>ხშირი რეფლექსიური ზმნები:</b> sich waschen, sich anziehen, sich setzen, sich freuen (auf / über), sich treffen, sich interessieren (für), sich erinnern (an), sich fühlen, sich beeilen, sich ausruhen, sich entschuldigen, sich vorstellen.<br>Ich freue mich auf das Wochenende. – შაბათ-კვირას ველოდები.<br>Wir treffen uns um 8 Uhr. – 8 საათზე შევხვდებით.<br>Ich interessiere mich für Musik. – მუსიკით ვარ დაინტერესებული.`,
'კითხვითი ნაცვალსახელები':`<hr>Wer ist das? – Das ist mein Bruder.<br>Was machst du? – Ich lerne.<br>Wen siehst du? – Ich sehe meinen Freund.<br>Wem gehört das Buch? – Es gehört mir.<br>Wessen Tasche ist das? – Das ist Annas Tasche.<br>Welches Auto ist neu? | Was für ein Film ist das? – Ein Krimi.`,
'მიმთითებელი ნაცვალსახელები და es':`<hr>Wie findest du den Film? – Den finde ich gut. – ის ფილმი მომწონს.<br>Das ist mein Bruder. – ეს ჩემი ძმაა.<br>Es regnet. | Es ist 8 Uhr. | Es geht mir gut. | Es gibt einen Park.`,
'dieser, jeder, welcher':`<hr>Dieser Mann ist nett. – ეს კაცი კეთილია.<br>Ich kaufe diese Jacke. – ამ ქურთუკს ვყიდულობ.<br>Jeder Tag ist anders. – ყოველი დღე განსხვავებულია.<br>Welcher Bus fährt zum Bahnhof? – რომელი ავტობუსი მიდის სადგურზე?<br>Jeden Morgen trinke ich Kaffee. – ყოველ დილით ყავას ვსვამ.`,
'ბრძანებითი და რეფლექსიური ზმნები':`<hr><b>ფორმები:</b> du – ფუძე (-e სურვილისამებრ): Komm! Warte! | ihr – Kommt! | Sie – Kommen Sie!<br>უარყოფა: Komm nicht! Kommen Sie nicht!<br>Mach die Tür zu! – კარი დახურე!<br>Bitte setzen Sie sich! – გთხოვთ, დაჯექით!<br>Seid leise! – ჩუმად იყავით!<br>Sei nicht traurig! – ნუ დარდობ!`,
'უარყოფა და კითხვითი სიტყვები':`<hr>Ich habe kein Geld. – ფული არ მაქვს.<br>Ich bin nicht müde. – არ ვარ დაღლილი.<br>Das ist nicht mein Buch. – ეს ჩემი წიგნი არ არის.<br>Ich arbeite nicht. – არ ვმუშაობ. (მთელი წინადადების უარყოფა, nicht ბოლოშია)<br>Ich fahre nicht nach Berlin, sondern nach Wien. – ბერლინში კი არა, ვენაში მივდივარ.`,
'Präteritum':`<hr><b>რეგულარული:</b> ფუძე + -te: lernen → ich lernte, du lerntest, er lernte, wir lernten, ihr lerntet, sie lernten.<br><b>ხშირი არარეგულარული:</b> gehen – ging, kommen – kam, sehen – sah, essen – aß, trinken – trank, fahren – fuhr, schreiben – schrieb, lesen – las, nehmen – nahm, geben – gab, bleiben – blieb, finden – fand, sprechen – sprach.<br>Ich war gestern im Kino. – გუშინ კინოში ვიყავი.<br>Er hatte keine Zeit. – დრო არ ჰქონდა.<br>Wir konnten nicht kommen. – ვერ მოვედით.`,
'Futur I':`<hr>Ich werde morgen anrufen. – ხვალ დავრეკავ.<br>Er wird Arzt werden. – ექიმი გახდება.<br>Es wird regnen. – წვიმს (წვიმა იქნება).<br>Wir werden nach Berlin fahren. – ბერლინში წავალთ.<br>ხშირად საკმარისია აწმყო + დრო: Morgen rufe ich an.`,
'შედარება':`<hr>Mein Auto ist schneller als dein Auto. – ჩემი მანქანა შენსზე სწრაფია.<br>Er ist so groß wie ich. – ის ჩემხელაა.<br>Das ist der beste Film. – ეს საუკეთესო ფილმია.<br>Tbilisi ist größer als Batumi.<br><b>უმლაუტით:</b> alt → älter → am ältesten, jung → jünger, lang → länger, warm → wärmer, kalt → kälter, stark → stärker, klug → klüger.<br><b>-t, -d, -s, -ß, -z:</b> am ältesten, am heißesten, am kürzesten.`,
'ზმნები Dativ-თან':`<hr>Das Essen schmeckt mir. – საჭმელი მომწონს.<br>Der Film gefällt mir. – ფილმი მომწონს.<br>Mir ist kalt / warm. – მცივა / მცხელა.<br>Wie geht es dir? – Mir geht es gut.<br>Das Buch gehört meinem Bruder. – წიგნი ჩემი ძმისაა.<br>Ich danke dir. – გმადლობ.`,
'ზმნები წინდებულით':`<hr>Ich warte auf den Bus. – ავტობუსს ველოდები.<br>Ich denke an dich. – შენზე ვფიქრობ.<br>Ich freue mich auf die Ferien. – არდადეგებს ველოდები.<br>Wir sprechen über das Wetter. – ამინდზე ვსაუბრობთ.<br>Ich interessiere mich für Fußball. – ფეხბურთით ვარ დაინტერესებული.`,
'დროის წინდებულები':`<hr>Ich stehe um 7 Uhr auf. – 7 საათზე ვდგები.<br>Am Montag habe ich Unterricht. – ორშაბათს გაკვეთილი მაქვს.<br>Im Juli fahre ich in Urlaub. – ივლისში შვებულებაში მივდივარ.<br>Seit zwei Jahren lerne ich Deutsch. – ორი წელია გერმანულს ვსწავლობ.<br>Von 9 bis 17 Uhr arbeite ich. – 9-დან 17 საათამდე ვმუშაობ.<br>In einer Stunde bin ich da. – ერთ საათში იქ ვიქნები.`,
'რიცხვები, საათი, თარიღი':`<hr><b>დიდი რიცხვები:</b> 100 hundert, 101 hunderteins, 200 zweihundert, 1.000 tausend, 1.000.000 eine Million.<br><b>წელი:</b> 1999 – neunzehnhundertneunundneunzig; 2026 – zweitausendsechsundzwanzig.<br><b>ფასი:</b> 2,50 € – zwei Euro fünfzig.<br><b>საათი:</b> 8:10 – zehn nach acht; 8:25 – fünf vor halb neun; 8:45 – Viertel vor neun. ყურადღება: halb neun = 8:30 (არა 9:30).<br><b>რიგითი თარიღში:</b> am ersten, zweiten, dritten, siebten, zwanzigsten Mai.`,
'Konjunktiv II':`<hr>Ich wäre gern reich. – მინდოდა მდიდარი ვყოფილიყავი.<br>Wenn ich Geld hätte, würde ich ein Haus kaufen. – ფული რომ მქონდეს, სახლს ვიყიდდი.<br>Könntest du mir helfen? – დამეხმარები?<br>Ich hätte gern ein Glas Wasser. – ერთ ჭიქა წყალს ვისურვებდი.<br>Du solltest mehr lernen. – მეტი უნდა ისწავლო.`,

})();
(function(){
const RP=(arr,spec)=>{const old=arr.slice(),used=new Set(),out=[];spec.forEach(([t,srcs])=>{const seen=new Set(),list=[];(srcs||[t]).forEach(s=>{const g=old.find(x=>x[0]===s);if(!g){console.warn('missing',s);return}used.add(g);g[1].forEach(p=>{if(!seen.has(p[0])){seen.add(p[0]);list.push(p)}})});out.push([t,list])});old.forEach(g=>{if(!used.has(g))console.warn('unused',g[0])});arr.length=0;arr.push(...out)};
RP(L.de.PH,[['მისალმება და გაცნობა',['ყოველდღიური','გაცნობა']],['თავაზიანობა და მადლობა',['თავაზიანობა და მილოცვები','მადლობა და დამშვიდობება']],['რესტორანი და კაფე'],['მაღაზია, ფული და ფოსტა',['მაღაზია','ფული, ფოსტა, დახმარება']],['გზა და ტრანსპორტი'],['სასტუმრო'],['ჯანმრთელობა და გადაუდებელი'],['ტელეფონი და გეგმები',['ტელეფონი და ინტერნეტი','შეხვედრები და გეგმები']],['სამსახური და სწავლა',['სამსახური და სწავლა','ენის სწავლა']],['გრძნობები და მოკლე საუბარი',['გრძნობები და აზრი','ამინდი და მოკლე საუბარი']]]);
RP(L.en.PH,[['მისალმება და გაცნობა',['ყოველდღიური','გაცნობა']],['თავაზიანობა და მილოცვები',['თავაზიანობა','თავაზიანობა და მილოცვები']],['რესტორანი და მაღაზია',['რესტორანი და მაღაზია','მაღაზია დამატებით']],['გზა და მიმართულებები',['გზა და ტრანსპორტი','მიმართულებები']],['სასტუმრო'],['დახმარება და პრობლემები',['დახმარება და ჯანმრთელობა','გაგება და პრობლემები']],['სამუშაო და ჯანმრთელობა',['სამსახური და ჯანმრთელობა']],['გეგმები და ტელეფონი',['გეგმები და ტელეფონი','გეგმები და გამოცდილება']],['გრძნობები და საუბარი',['გრძნობები და სწავლა','თანხმობა და საუბარი']]]);
})();
let S={v:'main',t:'gr',l:'de'},P={};
try{P=JSON.parse(localStorage.getItem('p2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('p2',JSON.stringify(P))}catch(e){}};
const go=o=>{S={l:S.l,...o};render();scrollTo(0,0)};
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang=S.l==='en'?'en-US':'de-DE';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const wrow=w=>`<div class="w"><div class="t"><div class="f">${w[0]}</div>${w[1]?`<div class="p">${w[1]}</div>`:''}</div><div>${w[2]}</div><button class="say" aria-label="მოსმენა" data-t="${w[0]}" onclick="say(this.dataset.t)">♪</button></div>`;
function startQuiz(){
 const ws=D[S.l].ls[S.i].w;
 const q=shuf(ws).slice(0,20).map(w=>({w,o:shuf([w[2],...shuf(ws.filter(x=>x!==w)).slice(0,3).map(x=>x[2])])}));
 go({v:'quiz',i:S.i,q,k:0,sc:0,a:null});
}
function pick(j){if(S.a!==null)return;const q=S.q[S.k];S.a=j;if(q.o[j]===q.w[2])S.sc++;render()}
function next(){S.k++;S.a=null;if(S.k>=S.q.length){const key=S.l+S.i,pc=Math.round(S.sc/S.q.length*100);P[key]=Math.max(P[key]||0,pc);save()}render()}
function render(){
 const a=document.getElementById('app');let h='';
 if(S.v==='main'){
  h=`<h1>ლინგო</h1><p class="sub">გრამატიკა, ლექსიკა და ფრაზები — დამწყებისთვის.</p><div class="pr">${[['de','🇩🇪 გერმანული'],['en','🇬🇧 ინგლისური']].map(x=>`<button class="pill${S.l===x[0]?' on':''}" onclick="S.l='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div class="pr3">${[['gr','📘','გრამატიკა'],['lex','🔤','ლექსიკა'],['ph','💬','ფრაზები']].map(x=>`<button class="pill tab${S.t===x[0]?' on':''}" onclick="S.t='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`;
  if(S.t==='gr'){
   h+='<p class="hint">გრამატიკა — გაიარე თანმიმდევრობით.</p>';let n=0;const Lg=L[S.l];
   for(const c in Lg.CAT){h+=`<div class="sec">${c}</div>`;Lg.CAT[c].forEach(t=>{const x=Lg.GR.find(y=>y[1]===t);if(!x)return;n++;h+=`<details class="gd"><summary><span>${n}. ${x[1]}</span><span class="lv">${x[0]}</span></summary><div class="g">${x[2]}${Lg.EXT[x[1]]||''}</div>${EXQ[S.l]&&EXQ[S.l][x[1]]?`<button class="cta" style="width:calc(100% - 24px);margin:0 12px 12px" onclick="startGQ(${Lg.GR.indexOf(x)})">✏️ სავარჯიშო</button>`:''}</details>`})}
  }else if(S.t==='lex'){
   h+=`<p class="hint">ლექსიკა — ${D[S.l].ls.reduce((n,l)=>n+l.w.length,0)} სიტყვა თემების მიხედვით.</p>`;
   D[S.l].ls.forEach((l,i)=>{const b=P[S.l+i];h+=`<button class="row" onclick="go({v:'lesson',i:${i}})"><span>${i+1}. ${l.t}</span><span class="lv">${b===undefined?'📖':b+'%'}</span></button>`});
  }else{
   h+='<p class="hint">ფრაზები — '+L[S.l].PH.reduce((n,g)=>n+g[1].length,0)+' ფრაზა სიტუაციების მიხედვით.</p>'+L[S.l].PH.map(g=>`<div class="sec">${g[0]}</div><div class="card">${g[1].map(wrow).join('')}</div>`).join('');
  }
 }else if(S.v==='lesson'){
  const l=D[S.l].ls[S.i];
  h=`<button class="back" onclick="go({v:'main',t:'lex'})">‹ უკან</button><h2>${l.t}</h2><div class="card">${l.w.map(wrow).join('')}</div>${l.g?'<div class="g">'+l.g+'</div>':''}<button class="cta" onclick="startQuiz()">ტესტის დაწყება</button>`;
 }else{
  const n=S.q.length;
  h=`<button class="back" onclick="${typeof S.i==='string'?"go({v:'main',t:'gr'})":"go({v:'lesson',i:"+S.i+"})"}">‹ ${typeof S.i==='string'?'გრამატიკა':'გაკვეთილი'}</button>`;
  if(S.k>=n){
   h+=`<h2>შედეგი: ${S.sc} / ${n}</h2><p class="sub">საუკეთესო: ${P[S.l+S.i]}%</p><button class="cta" onclick="${typeof S.i==='string'?'startGQ('+S.i.slice(1)+')':'startQuiz()'}">თავიდან</button>`;
  }else{
   const q=S.q[S.k];
   h+=`<p class="sub">${S.k+1} / ${n}</p><div class="q"${typeof S.i==='string'?' style="font-size:1.3rem"':''}>${q.w[0]}</div><p class="sub" style="text-align:center">${q.w[1]}</p>`;
   q.o.forEach((o,j)=>{let c='opt';if(S.a!==null){if(o===q.w[2])c+=' ok';else if(j===S.a)c+=' bad'}h+=`<button class="${c}" onclick="pick(${j})">${o}</button>`});
   if(S.a!==null)h+=`<button class="cta" onclick="next()">${S.k+1>=n?'შედეგი':'შემდეგი'}</button>`;
  }
 }
 a.innerHTML=h;
}
render();
</script>
